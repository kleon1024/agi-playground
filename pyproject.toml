[project]
name = "agi-playground"
version = "0.0.1"
description = "Full-stack AI curriculum: data, pretraining, post-training, RL, inference, evals, agent harnesses - from readable toys to production tools, verified by real runs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
