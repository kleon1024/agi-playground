[project]
name = "agi-playground"
version = "0.0.1"
description = "Full-stack AI curriculum: data, pretraining, post-training, RL, inference, evals, agent harnesses - from readable toys to production tools, verified by real runs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
lm-eval = [
    "lm-eval>=0.4.12",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
]
# Opt-in, and not part of `uv run pytest`. Almost every test here is a
# structural check that needs no framework, and keeping the default install
# free of a 200MB wheel is worth protecting. The exception is
# `tests/test_decode_correctness.py`, which compares a cached decode path
# against recomputing from scratch -- a numerical claim that cannot be checked
# without the numbers. Run it with `uv run --group torch pytest`.
torch = ["torch>=2.5"]
# Opt-in, for mission 09's RDKit descriptor baseline and Murcko-scaffold
# split only. Not part of the default install for the same reason as `torch`.
chem = ["rdkit>=2023.9"]
game = [
    "gymnasium>=1.0",
    "minigrid>=2.3",
]
# Opt-in, for mission 05's real-photo (VQA v2 / COCO) stages only -- resizing
# real JPEGs to this repo's 32x32 vision-token input needs a real image
# decoder, which stdlib does not have. Not part of the default install for
# the same reason as `torch`.
vision = ["pillow>=10"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
