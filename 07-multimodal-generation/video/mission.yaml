# Video path of topic 07 — Synthetic video generation
# (judged by cost first, quality second)
#
# Every other path in this repository trains something within a single
# GPU's reach in minutes to hours. Video breaks that assumption before a
# single design choice gets made: a clip is dozens of frames, each frame is
# hundreds of tokens once patch-embedded, and a temporal model multiplies the
# two. The first honest question here is not "how good is the generated
# video" — it is "does this repository's compute discipline (real runs, a
# declared local-GPU-or-Modal lane, a hard dollar ceiling) survive contact
# with this domain at all." That is why the primary metric pairs quality with
# cost, and why a compute-infeasibility finding is written into acceptance as
# a legitimate outcome, not a failure to hide.
#
# This path reuses the patch-embedding and cross-attention work the vision
# path adds to 01-language-model/02-pretrain/core/model.py, extended from a
# single frame to a short sequence. It does not reuse a serving or RL
# capability, and it declares none of its own.

stakeholder: >
  Someone deciding whether a self-trained, from-scratch video-generation
  pipeline is worth building at all, given its compute cost, against simply
  calling a hosted video-generation API. They are not asking "can this
  generate a convincing video" — hosted models already do that. They are
  asking what a few frames of synthetic video actually cost to train and
  produce on hardware this repository owns or rents, and whether that cost is
  small enough to make the exercise worth running before deciding to spend
  more. A follow-on stage uses the compute headroom the feasibility stage
  measured (8.5% of its declared ceiling) to attempt a harder version:
  longer sequences (16-32 frames) and/or multi-object scenes (2+ moving
  shapes, occlusion), still procedurally generated.

job: >
  Given a short prompt or seed condition (for example, "a red square moving
  right"), generate a short sequence of synthetic video frames consistent
  with that condition, and report what producing that sequence actually cost
  in GPU-hours or dollars.

decision: >
  Whether a video tokenizer — frames turned into a discrete token sequence,
  extending mission 05's single-image patch embedding into a temporal
  dimension — paired with a small autoregressive or diffusion model over
  those tokens is buildable and trainable inside this repository's real-run,
  declared-compute-lane discipline at all. The first decision this mission
  makes is a feasibility decision, not a quality one; a quality comparison
  only becomes meaningful once feasibility is settled. The follow-on stage
  asks whether that same feasibility finding holds as sequence length or
  scene complexity increases toward the ceiling that was never approached at
  8-frame, single-object scale — and specifically whether the tokenizer, not
  compute, remains the binding constraint, since the generation-model
  stage's own report already identified codec training difficulty, not the
  compute ceiling, as the real risk.

baseline: >
  Two.
  (1) Frame-repeat / linear extrapolation — repeat the last real frame, or
      linearly extrapolate the motion seen in the conditioning frames, with no
      learned model at all. This is the "no learning" control every generation
      metric must beat to mean anything.
  (2) A published toy video-generation number, named and dated, from a public
      benchmark in this problem class (for example, a Moving MNIST
      reconstruction-loss result), cited per this repository's rule that
      external published results are usable when attributed — not
      reproduced, only named as a point of reference.

primary_metric: >
  A held-out reconstruction or next-frame prediction error (pixel-level or
  token-level, whichever the tokenizer stage settles on) on synthetic
  sequences the model did not train on, reported beside two numbers that
  matter as much as the metric itself here: training wall-clock and dollar
  cost, on whichever compute lane (local 4090 or Modal) the run actually
  used. Given the compute risk named above, a quality number with no cost
  number attached is an incomplete result for this mission specifically, more
  so than for any other mission in this repository.

guardrails:
  - Every number traces to a runs/ entry, same as every other mission.
  - A declared compute ceiling (see cost_budget) is checked before it is
    crossed, not after. If a training run would exceed it before producing a
    usable checkpoint, the run stops and the ceiling being hit is reported as
    a real finding — compute infeasibility at this repository's scale — not
    quietly worked around by shrinking the task until it fits and calling
    that the plan all along.
  - No claim of real-world video realism, coherence beyond the conditioning
    window, or resemblance to any production video-generation system's
    output.
  - The synthetic dataset is generated by this mission's own code, with a
    fixed seed and a recorded generation script, so its provenance needs no
    external attribution and no license question.

latency_budget: >
  Not an interactive constraint — nobody is waiting on a synthetic clip in
  real time. What is measured and reported is generation wall-clock per short
  clip at inference time, since that number is what tells a reader whether
  this pipeline could ever be made interactive, which the stakeholder's
  underlying question depends on even though this mission does not attempt
  it.

cost_budget: >
  A hard ceiling declared before the first training run, in both GPU-hours
  (local 4090 lane) and real dollars (if the Modal lane is used instead or as
  well), printed into every runs/ entry as it is consumed. A stage that would
  exceed it stops and reports rather than continuing — the same discipline
  mission 04's cost_budget field applies to hosted-API spend, applied here to
  training compute, which is the dominant cost in this mission rather than a
  secondary one. The follow-on stage may raise the declared ceiling given the
  measured headroom (8.5% used at 8-frame scale), but still declares a hard
  number before running and reports CEILING_EXCEEDED rather than silently
  raising it after the fact.

capabilities: []
  # None yet. A video-token encoder is a plausible future consumer of a
  # shared perceive-understand capability once a second mission needs the
  # identical contract — per the admission gate in
  # standards/mission-contract.md, it is not created preemptively here.

acceptance:
  - Beats the frame-repeat/extrapolation baseline on the reconstruction
    metric by more than run-to-run spread, OR reports an honest
    infeasibility finding (the declared compute ceiling reached before a
    usable checkpoint existed) — either is an acceptable, mission-complete
    outcome, and the second must not be quietly avoided by lowering scope
    until it disappears.
  - Every stage has an exact command and a runs/ entry before being marked
    verified.
  - Training and inference wall-clock and dollar cost are measured on real
    runs and reported beside the quality metric, never as a separate,
    unlinked number.
  - Failures (including a stalled or diverged training run) are catalogued
    by category, not merely counted.

proves: >
  Whether extending this repository's patch-embedding approach from a single
  frame to a short temporal sequence is buildable within its real-run,
  declared-compute-lane discipline, and what doing so actually costs. This is
  a systems and feasibility claim, in the same register as mission 01's own
  "proves a systems claim, not a quality claim" — not a claim about generated
  video quality.

does_not_prove: >
  Nothing about real-world video realism, coherence over more than a handful
  of frames, or competitiveness with any production text-to-video or
  image-to-video system. Nothing about audio, sound-video synchrony, or any
  modality besides the synthetic visual sequence generated here. A
  reconstruction-error number on this mission's own synthetic dataset is not
  comparable to any published video-generation benchmark, for the same
  harness-and-task-are-the-independent-variable reason mission 01 stage 07
  establishes for language-model evaluation — this dataset, this tokenizer,
  this ceiling. And if the mission closes on an infeasibility finding rather
  than a trained model, that finding is scoped to this repository's declared
  compute lanes at the time of the run; it says nothing about what is
  feasible on different or larger hardware. The longer/multi-object
  follow-on stage still proves nothing about real-world video, camera
  motion, or any dataset not procedurally generated by this mission's own
  code.

  A further follow-on stage tested the multi-object half of that same named
  follow-on separately from the frame-count half: two independently-moving,
  occluding shapes at the original 8-frame length. All 3 seeds closed `MET`
  (lm_completion MSE beats frame-repeat by roughly 6.8x the run-to-run
  spread), but reconstruction quality is measurably worse than the
  single-object case (mean MSE 0.1483 vs 0.0851) and exact-match rate both
  fell and became far noisier (0.67%-28.67% vs 19.3%-22.0% at one object) —
  the tokenizer's one-token-per-frame capacity, not compute, is confirmed as
  the binding constraint along this second axis too. This stage tested
  2 objects only, and never combined with the longer-sequence extension —
  neither 3+ objects nor the two follow-on axes together is established by
  any run in this repository.
