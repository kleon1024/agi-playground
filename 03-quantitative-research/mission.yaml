# Mission 03 — Quantitative research (systematic strategy research)
#
# Mission 01 proved the language-model pipeline composes end to end. Mission 02
# tested whether the same platform layers generalize to a different decision
# loop — ranking — against data that is confounded but at least holds still.
# This mission tests something harder: does the architecture generalize to a
# domain where the data is adversarial, the relationships being modeled are
# actively hunted out of existence by other participants, and the signal is so
# faint that almost any modeling choice can be justified after the fact by a
# strategy that merely got lucky on one slice of history?
#
# Nothing in this file, or in this mission, is investment advice. It declares a
# method for evaluating a candidate trading signal, not a recommendation to
# trade one.

stakeholder: >
  A systematic-strategies researcher deciding whether a candidate signal earns
  a place in a live strategy book, and the risk manager who must sign off on
  its guardrails before any capital is allocated to it. Both need the same
  honest number; the researcher is the one most tempted to keep searching
  until they get it.

job: >
  Decide, on a fixed rebalance calendar, whether a candidate signal's implied
  portfolio should be added to the strategy book — a capital-allocation
  decision made once per rebalance, not a single trade recommendation.

decision: >
  Given a point-in-time-correct panel of public market data for a declared
  universe and rebalance calendar, decide the target portfolio weights for the
  next holding period — including the decision to hold no position at all when
  the signal does not clear its own transaction and capacity costs.

baseline: >
  Two, and the mission must beat both after costs:
  (1) buy-and-hold of an equal-weighted basket of the same universe, rebalanced
      only to correct drift — the passive floor, with zero turnover beyond that
      correction and therefore near-zero transaction cost;
  (2) a published, non-proprietary cross-sectional momentum heuristic (12-month
      return, skipping the most recent month), costed the same way the
      candidate strategy is. Momentum is the field's popularity baseline: a
      well-known factor that is disconcertingly hard to beat net of costs, and
      a strategy that cannot clear it has not demonstrated a new edge.

primary_metric: >
  Annualized Sharpe ratio net of modeled transaction and market-impact costs,
  measured out-of-sample on walk-forward folds built with purged and embargoed
  cross-validation — purged so that overlapping label windows never share
  information across the train/test boundary, embargoed so that the test fold
  does not start the instant training data ends. Reported as a mean and
  standard deviation across at least 5 non-overlapping folds; a single fold is
  not a result, for the same reason a single seed was not one in mission 02.
  Reported beside a deflated Sharpe ratio that discounts the result for the
  number of strategy variants actually searched during development — the raw
  Sharpe of the winner is not the number that matters here.

guardrails:
  - Net-of-cost Sharpe must be reported beside gross Sharpe for every retained
    variant; a strategy profitable only before costs fails this guardrail
    outright, regardless of its gross number
  - Per-name position size must not exceed 5% of that name's trailing 20-day
    average dollar volume, so the backtest never assumes it can trade in size
    the market could not actually absorb
  - Maximum drawdown across folds must not exceed 1.5x the passive baseline's
    drawdown over the same folds; a strategy that only wins by taking more risk
    has not demonstrated skill
  - The deflated Sharpe ratio must stay positive at a stated significance level
    after correcting for the number of variants tried — an in-sample Sharpe
    with no deflated counterpart reported is treated as a failed guardrail, not
    a missing one
  - Point-in-time integrity is checked programmatically, not merely declared —
    every datum a signal consumes at decision date t must carry a public
    availability timestamp at or before t, and any violation invalidates the
    fold it occurred in
  - The backtest universe must include every name that was ever a member during
    the study window, not only names that survived to today

latency_budget: >
  This is a research and rebalance-decision system, not a low-latency execution
  system. The budget is p50 and p95 wall-clock to compute one full rebalance
  decision — signal generation, ranking, and target-weight sizing across the
  declared universe — measured on the local lane. Order-routing and
  execution-venue latency are out of scope; this mission does not build or
  claim an execution system.

cost_budget: >
  Two separate numbers, both measured rather than estimated: (1) real dollars
  for data acquisition and compute per backtest fold, amortized across all
  folds; (2) the modeled transaction and market-impact cost the strategy would
  pay per unit of capital traded, stated as an explicit cost model (spread,
  commission, and a participation-rate impact term) rather than a live
  brokerage bill, since no live capital is ever committed in this mission.

capabilities:
  - rank-decide   # cross-sectional signal ranking and position sizing is a
                   # ranking-and-decide problem, same capability mission 02
                   # opened for recommendation and ads
  # A purge/embargo walk-forward harness with multiple-testing correction is a
  # candidate capability ("validate-robustly") but stays inside this mission,
  # per the two-mission admission gate in standards/mission-contract.md, until
  # a second mission needs exactly this kind of adversarial-evaluation harness.

acceptance:
  - Beats BOTH baselines on net-of-cost Sharpe by more than the fold-to-fold
    standard deviation
  - No guardrail regresses past its stated threshold
  - The deflated Sharpe ratio is computed and reported, not just the raw one
  - Point-in-time integrity is verified programmatically with zero violations
    across all folds, not asserted from the data source's reputation
  - Latency and cost measured on real runs and inside budget
  - Failure cases catalogued: which regimes, which names, and which cost
    assumptions the strategy was most sensitive to
  - Every number traceable to a runs/ entry

proves: >
  That the platform's data-discipline and evaluation-discipline layers — the
  same ones built for missions 01 and 02 — extend to a domain where the
  evaluation harness itself (purge, embargo, deflated Sharpe, cost modeling) is
  part of the claim rather than an afterthought, and that a signal can be shown
  to clear a specific, pre-declared bar on a specific, reproducible historical
  proxy.

does_not_prove: >
  Nothing about live trading performance, and no money is ever at risk in this
  mission. A backtest, however carefully purged and embargoed, cannot establish
  that a strategy will make money going forward: markets are non-stationary,
  and a relationship a strategy exploits tends to erode once enough capital
  trades on it — the opposite failure mode from mission 02's confounded logged
  data, but just as fatal to any claim of durability. The market-impact model
  is a declared square-root participation assumption, not a measurement of how
  the market would actually have responded to this strategy's own order flow;
  a strategy that clears this guardrail could still move the market more than
  modeled once it traded real size. The strategy space searched in this
  mission is small — a handful of signal families over one historical window —
  so even a result that correctly beats its deflated Sharpe threshold here
  carries residual multiple-testing risk against the far larger space of
  strategies quantitative researchers explore across an entire field over
  decades. This mission does not constitute investment advice, does not
  recommend any security or strategy, and does not establish that its authors
  or anyone else has traded, or would trade, on any signal it describes.
