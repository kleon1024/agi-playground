# Mission 05 — Vision-language model (does the picture add anything?)
#
# Missions 01-04 all condition a decoder on text. This mission asks the next
# question honestly: can the same decoder condition on an image instead, and
# is that worth building versus calling a hosted VLM? The mission exists
# because the codebase already has everything a vision pathway needs except
# the vision pathway. mission 01's decoder (RoPE, RMSNorm, SwiGLU, the whole
# training loop) is architecture-agnostic at the block level; what it lacks is
# any way to feed it something that is not a 1-D sequence of discrete token
# ids. Confirmed by reading missions/01-language-model-agent/02-pretrain/core/model.py
# directly: Transformer.forward hardcodes nn.Embedding(cfg.vocab_size,
# cfg.d_model) as its only input path, and Attention.forward calls
# F.scaled_dot_product_attention(q, k, v, is_causal=True) with no
# cross-attention split. A patch embedding and a vision-token prefix are real
# new code, not a config flag — and this mission is where that code gets
# written and measured, not assumed.
#
# It is also a test of the reuse claim the plan for this mission was built on:
# that RoPE/RMSNorm/SwiGLU/the training loop transfer to a new modality
# unmodified, and only the input path needs new work. If that claim is false,
# this mission's stage 01 run record will say so.

stakeholder: >
  A developer who needs a model to answer short questions about an image —
  "what shape is on the left", "how many circles are there" — and must decide,
  before writing a line of training code, whether a small self-trained vision
  pathway grafted onto an existing decoder is worth its training cost, or
  whether a single hosted VLM API call already does the job for less.

job: >
  Given an image and a short question about it, produce a correct short
  answer, using a decoder that was trained on text and is now asked to
  condition on pixels as well.

decision: >
  Whether adding a vision-token prefix (patch embedding plus fused attention
  into mission 01's existing decoder) beats both a hosted VLM API and a
  text-only version of the same decoder with no image input at all. If the
  vision pathway cannot beat a text-only decoder answering blind, the pathway
  has added parameters without adding sight.

baseline: >
  Two, and the mission must beat both:
  (1) Hosted VLM API — a single call per question, image and question passed
      as-is, on the same held-out eval set. This is the "just call the API"
      control and the one that decides whether building anything here paid
      for itself.
  (2) Text-only decoder, no image input — the identical decoder architecture
      and training run, but the question is answered with no access to the
      image at all. This baseline exists to catch a specific failure mode: an
      eval set where the answer is guessable from the question's phrasing
      alone, which would make the vision pathway look like it works when it
      is actually decoration.

primary_metric: >
  Exact-match accuracy on a held-out synthetic image+question+answer set,
  reported beside training wall-clock and cost, with both baselines on the
  same set. No seed count is mandated yet because no stage has run; stage 01's
  own run record must state how many seeds it used and why, following the same
  discipline mission 02 and the architecture-ablation ladder already
  established — a gap smaller than run-to-run spread is reported as no result,
  not as a win.

guardrails:
  - Train and eval images are generated by disjoint random seeds, checked
    programmatically, so no eval instance is a near-duplicate of a training
    instance. A pathway that memorizes rather than sees would otherwise pass
    silently.
  - Stages 00-02 use a synthetic dataset (generated shapes, colors,
    positions) specifically so provenance is trivial and reproducible, and
    their results say nothing about real photographs. Stages 03-05 extend
    the mission onto a real photograph subset (VQA v2 / COCO, CC BY 4.0
    annotations, non-commercial Flickr ToU) with the same disjointness
    discipline applied by COCO image id rather than pixel hash; a passing
    number on stages 00-02 is never read as evidence about real
    photographs, and a number from stages 03-05 is never read as
    comparable to the full VQA v2 benchmark (a few hundred images, not
    40,000).
  - Every published number traces to a runs/ entry, same rule as every other
    mission in this repository.
  - No new shared capability is created for this mission alone. The vision
    encoder stays mission-local code until a second mission independently
    needs the identical input/output contract, per the admission gate in
    standards/mission-contract.md.

latency_budget: >
  Not a serving constraint yet — this mission does not reach a serving stage
  in its first pass. What is budgeted and reported is wall-clock per training
  run and per-question inference latency at eval time, both measured on
  whichever compute lane actually runs it (recorded in runs/, not named here).

cost_budget: >
  Two numbers, both measured rather than estimated. (1) Total training
  wall-clock and dollar cost for the vision-pathway run, declared before the
  run starts and printed into the runs/ entry as it is consumed. (2) Dollars
  per question answered through the hosted VLM baseline, since that is the
  number the stakeholder's build-vs-buy decision actually turns on. The
  dataset is synthetic and small by design, so a small compute budget is
  expected to be sufficient — a run that needs materially more should be
  treated as a signal the task is scoped wrong, not as license to spend more.
  Stages 03-05 add: a one-time, $0 dataset-fetch cost (tens of MB from
  public VQA v2/COCO mirrors), and a declared 30-minute wall-clock training
  ceiling on the local 4090 lane (checked after the run and reported as
  CEILING_EXCEEDED rather than silently shrunk, per mission 07/08's
  convention), since real JPEG decode and a larger patch grid cost
  materially more than the 32x32 synthetic case.

capabilities: []
  # Deliberately empty. A shared "perceive-understand" capability is named as
  # a likely future graduate in missions/02-personalized-discovery/README.md,
  # but per the admission gate it is promoted only once at least two missions
  # independently need the identical encoder contract. This mission's vision
  # pathway stays mission-local code until that second consumer exists.

acceptance:
  - Beats both baselines (hosted VLM API, text-only decoder) on exact-match
    accuracy by more than the run-to-run spread
  - Every stage has a runs/ entry with an exact command, hardware, wall-clock,
    cost, and metrics before it is marked verified
  - Train/eval image disjointness is checked programmatically and the check
    is shown to actually run, not merely asserted in prose
  - Failure modes are catalogued by category (e.g. wrong count, wrong color,
    wrong spatial relation), not merely reported as an aggregate accuracy
  - Every number traceable to a runs/ entry

proves: >
  That mission 01's decoder, training loop, and positional/normalization
  machinery (RoPE, RMSNorm, SwiGLU) compose with a genuinely new vision-token
  input path built for this mission, without rewriting the parts that are
  already architecture-agnostic. It also establishes, for the first time in
  this repository, a real measured comparison between a self-trained
  multimodal pathway and a hosted multimodal API on the same task.

does_not_prove: >
  Stages 00-02 prove nothing about real-photograph understanding — that
  dataset is synthetic by construction. Stages 03-05 extend to a small real
  photograph subset, but that extension does not prove: frontier-scale VLM
  capability (the model here is sized to train in minutes on a single
  consumer-grade GPU, several orders of magnitude below any deployed
  vision-language model); anything comparable to the full VQA v2 benchmark
  or leaderboard (a few hundred images, not the ~40,000-image validation
  set); or generalization to video, audio, or any other modality — those
  are separate missions with their own contracts. And nothing about which
  architecture choice (prefix fusion vs. cross-attention, patch size,
  encoder depth) is best in general; this mission measures the specific
  choice its stage 01 run record makes, not the design space around it.
