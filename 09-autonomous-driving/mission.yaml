# Topic 09 — Autonomous driving (closed-loop behavior cloning in a simulator)
#
# A real autonomous-driving system is not buildable in this repository: no
# vehicle, no sensor suite, no road network, and no way to verify a claim
# about real-world driving behavior. What IS buildable is the narrow
# technical question underneath the marketing framing: can a small,
# from-scratch policy, trained only on expert demonstrations in a
# procedurally generated driving simulator, drive in the loop — and does it
# survive scenarios its training distribution did not contain?
#
# The simulator is deliberately 2-D and synthetic: a car on a track with
# lane boundaries, obstacles that move, and a low-resolution bird's-eye
# "camera" render as the observation. That keeps every run on CPU in
# seconds, which is the point — the claim being tested is about the
# imitation-and-closed-loop method, not about vision quality at 4K.

stakeholder: >
  An engineer deciding whether to build a small self-driving capability
  (lane keeping, obstacle avoidance) from imitation learning in simulation
  before touching a real vehicle or a hosted autonomy stack. They are not
  asking "can AI drive a car" — they are asking whether a policy trained
  purely on expert demonstrations in a simulator can generalize at all, and
  where it breaks when the scenario changes.

job: >
  Given a low-resolution camera render of the road ahead, produce steering
  and throttle actions that keep the car in its lane and avoid obstacles for
  a full episode, having learned the behavior only from demonstrations of a
  rule-based expert in the same simulator.

decision: >
  Whether closed-loop behavior cloning — a policy trained on expert state-
  action pairs, evaluated in the loop rather than on held-out imitation
  accuracy — beats a no-learning rule baseline and survives out-of-
  distribution scenarios, and at what wall-clock cost. If the cloned policy
  matches the expert in-distribution but collapses on sharper curves or
  faster obstacles, that boundary is the finding, not a failure to hide.

baseline: >
  Two, and every stage must report against both:
  (1) A no-learning rule policy — the same lane-following controller the
      expert is built from but without its avoidance logic — as the floor a
      learned policy must clear in closed-loop metrics.
  (2) The expert policy itself, run in the same simulator on the same
      scenarios: the ceiling of what imitation can possibly recover, since
      the learner's demonstrations come from it.
  The closed-loop metrics (episode completion, collision rate, off-road
  rate, progress) are the comparison currency, never held-out imitation
  loss alone — imitation accuracy can be high while the policy drives off
  the road, and the mission exists to show that gap.

primary_metric: >
  Closed-loop episode completion rate (fraction of episodes reaching the
  target distance without collision or off-road excursion), reported beside
  collision rate and off-road rate, and beside training wall-clock. One
  number is never reported alone: completion rate without collision rate
  hides a policy that succeeds by ignoring obstacles.

guardrails:
  - Every number traces to a runs/ entry — command, hardware, wall-clock,
    seed, and scenario parameters.
  - The simulator's train/eval scenarios are generated by disjoint random
    seeds, checked programmatically, so a policy that memorizes tracks
    rather than drives is caught by the eval split.
  - Stage 05's harder scenarios (sharper curves, faster obstacles) are
    declared before the eval runs, not tuned until the cloned policy wins —
    per the same discipline every other topic applies to declared baselines.
  - No claim of real-vehicle or real-road behavior: the simulator is 2-D,
    synthetic, and deterministic, and the report says so beside every
    metric.

latency_budget: >
  Wall-clock per training run and per closed-loop eval episode, both
  measured on the local CPU lane and recorded in runs/ — not a serving
  latency contract, since this topic never reaches a real-time vehicle
  loop. The decision-relevant figure is total training wall-clock, because
  that is what the build-vs-buy question turns on.

cost_budget: >
  CPU-only, $0 marginal cost. The simulator and policies are designed to
  train in seconds; a run that needs materially more is a signal the
  scenario is scoped wrong, not license to spend more.

capabilities: []
  # None yet. The behavior-cloning loop reuses topic 01's training-loop
  # discipline conceptually but imports no code; a shared "imitation-in-
  # simulation" capability is not promoted until a second topic
  # independently needs the identical contract, per the admission gate in
  # standards/mission-contract.md.

acceptance:
  - Cloned policy beats the no-learning rule baseline on completion rate by
    more than the run-to-run spread across seeds
  - The imitation-vs-closed-loop gap is reported explicitly: held-out
    imitation accuracy beside in-loop completion rate, never one without
    the other
  - Every stage has a runs/ entry with command, hardware, wall-clock, and
    metrics before being marked verified
  - Stage 05's out-of-distribution boundary is reported as a finding
    whether it holds or breaks, not tuned away
  - The does_not_prove boundary appears in both mission.yaml and the README

proves: >
  That a small policy trained purely on expert demonstrations in a
  synthetic 2-D driving simulator can drive in the loop at all — and,
  just as importantly, exactly where it stops: the boundary between
  in-distribution scenarios it matches the expert on and
  out-of-distribution scenarios it does not. It also establishes a real,
  CPU-measured wall-clock profile for an imitation pipeline, which is the
  number a build-vs-buy decision actually turns on.

does_not_prove: >
  This topic does NOT make any claim about autonomous driving on real
  roads, real vehicles, or real sensor data. The simulator is 2-D, fully
  synthetic, deterministic, and toy-scale; the "camera" is a low-resolution
  bird's-eye render, not a real camera with weather, lighting, and physics.
  A policy that drives this simulator says nothing about perception
  robustness, sensor fusion, safety cases, regulatory approval, or the
  behavior of a real autonomy stack. The generalization boundary measured
  in stage 05 is a boundary of this simulator, not of driving.

